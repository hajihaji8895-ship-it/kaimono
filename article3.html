  <div class="card">
    <h1>ついで買いをなくす！計画的な買い出しの秘訣</h1>
    
    <h2>1. 買い出しリストにないものは買わない</h2>
    <p>店舗に行く前に必ず買うものをメモしておき、リストに書いていないものはカゴに入れないという鉄則を守りましょう。</p>

    <h2>2. 空腹時に買い物へ行かない</h2>
    <p>空腹時にスーパーへ行くと、予定外のお惣菜やお菓子などを購入してしまう確率が大幅に上がります。満腹時や食後の買い出しがおすすめです。</p>

    <h2>3. 滞在時間を短くする</h2>
    <p>店内に長く滞在するほど無駄な商品が目に入りやすくなります。目的の売り場だけを効率よく回って会計を済ませましょう。</p>
